name: Build plugins

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build plugin archives
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"

      - name: Build plugin archives
        shell: bash
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version 9.1.0 --distribution-type bin
          ./gradlew buildPlugin :demo:buildPlugin :markdown-preview:buildPlugin --stacktrace

      - name: Upload plugin archives
        uses: actions/upload-artifact@v7
        with:
          name: webview-plugin-zips
          if-no-files-found: error
          path: |
            build/distributions/*.zip
            demo/build/distributions/*.zip
            markdown-preview/build/distributions/*.zip
