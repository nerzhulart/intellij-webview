name: Build plugins

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.0 or 0.1.0-rc.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build plugin archives
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read IntelliJ Platform version
        id: intellij-platform-version
        shell: pwsh
        run: |
          $versionLine = Get-Content -LiteralPath "gradle.properties" |
            Where-Object { $_ -match '^platformVersion=' } |
            Select-Object -First 1
          if (-not $versionLine) {
            throw "platformVersion is missing from gradle.properties"
          }

          $version = $versionLine.Substring("platformVersion=".Length).Trim()
          if (-not $version) {
            throw "platformVersion is empty in gradle.properties"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore IntelliJ Platform SDK
        id: intellij-sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: .intellijPlatform/ides
          key: intellij-platform-sdk-${{ steps.intellij-platform-version.outputs.version }}-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts') }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Enable IntelliJ Platform SDK cache
        shell: bash
        run: echo "GRADLE_OPTS=-Dorg.gradle.project.org.jetbrains.intellij.platform.intellijPlatformIdesCacheEnabled=true" >> "$GITHUB_ENV"

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: gradle wrapper --gradle-version 9.1.0 --distribution-type bin

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Resolve IntelliJ Platform SDK
        if: steps.intellij-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./gradlew :compileKotlin --stacktrace
          if ! find .intellijPlatform/ides -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
            echo "::error::IntelliJ Platform SDK cache was not populated"
            exit 1
          fi

      - name: Save IntelliJ Platform SDK
        if: steps.intellij-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .intellijPlatform/ides
          key: ${{ steps.intellij-sdk-cache.outputs.cache-primary-key }}

      - name: Build plugin archives
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid SemVer release version: $VERSION"
            exit 1
          fi
          version_without_build="${VERSION%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            prerelease="${version_without_build#*-}"
            IFS='.' read -ra identifiers <<<"$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                echo "::error::Invalid numeric prerelease identifier with a leading zero: $identifier"
                exit 1
              fi
            done
          fi
          ./gradlew \
            -PpluginVersion="$VERSION" \
            buildPlugin :demo:buildPlugin :markdown-preview:buildPlugin \
            --stacktrace

      - name: Build and verify npm packages
        working-directory: webview-src
        env:
          NPM_PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bun run pack:npm
          bun run verify:npm

      - name: Upload plugin archives
        uses: actions/upload-artifact@v7
        with:
          name: webview-plugin-zips
          if-no-files-found: error
          path: |
            build/distributions/*.zip
            demo/build/distributions/*.zip
            markdown-preview/build/distributions/*.zip

      - name: Upload npm packages
        uses: actions/upload-artifact@v7
        with:
          name: webview-npm-packages
          if-no-files-found: error
          path: |
            build/npm/*.tgz
            build/npm/npm-packages.json
