name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.1.0 or 0.1.0-rc.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read IntelliJ Platform version
        id: intellij-platform-version
        shell: pwsh
        run: |
          $versionLine = Get-Content -LiteralPath "gradle.properties" |
            Where-Object { $_ -match '^platformVersion=' } |
            Select-Object -First 1
          if (-not $versionLine) {
            throw "platformVersion is missing from gradle.properties"
          }

          $version = $versionLine.Substring("platformVersion=".Length).Trim()
          if (-not $version) {
            throw "platformVersion is empty in gradle.properties"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore IntelliJ Platform SDK
        id: intellij-sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: .intellijPlatform/ides
          key: intellij-platform-sdk-v2-${{ steps.intellij-platform-version.outputs.version }}-${{ runner.os }}

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Enable IntelliJ Platform SDK cache
        shell: bash
        run: echo "GRADLE_OPTS=-Dorg.gradle.project.org.jetbrains.intellij.platform.intellijPlatformIdesCacheEnabled=true" >> "$GITHUB_ENV"

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1/com.jetbrains.intellij.idea/**

      - name: Resolve IntelliJ Platform SDK
        if: steps.intellij-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          gradle :compileKotlin --stacktrace --build-cache --configuration-cache
          if ! find .intellijPlatform/ides -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .; then
            echo "::error::IntelliJ Platform SDK cache was not populated"
            exit 1
          fi

      - name: Build plugin archives
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid SemVer release version: $VERSION"
            exit 1
          fi
          version_without_build="${VERSION%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            prerelease="${version_without_build#*-}"
            IFS='.' read -ra identifiers <<<"$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                echo "::error::Invalid numeric prerelease identifier with a leading zero: $identifier"
                exit 1
              fi
            done
          fi
          gradle \
            -PpluginVersion="$VERSION" \
            buildPlugin :demo:buildPlugin :markdown-preview:buildPlugin \
            --stacktrace \
            --build-cache \
            --configuration-cache

      - name: Build and verify npm packages
        working-directory: webview-src
        env:
          NPM_PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bun run pack:npm
          bun run verify:npm

      - name: Upload plugin archives
        uses: actions/upload-artifact@v7
        with:
          name: webview-plugin-zips
          if-no-files-found: error
          path: |
            build/distributions/*.zip
            demo/build/distributions/*.zip
            markdown-preview/build/distributions/*.zip

      - name: Upload npm packages
        uses: actions/upload-artifact@v7
        with:
          name: webview-npm-packages
          if-no-files-found: error
          path: |
            build/npm/*.tgz
            build/npm/npm-packages.json

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download plugin archives
        uses: actions/download-artifact@v8
        with:
          name: webview-plugin-zips
          path: release-assets

      - name: Download npm packages
        uses: actions/download-artifact@v8
        with:
          name: webview-npm-packages
          path: release-npm

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Validate release artifacts
        id: artifacts
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          mapfile -d '' plugin_archives < <(find release-assets -type f -name '*.zip' -print0 | sort -z)
          if [[ "${#plugin_archives[@]}" -ne 3 ]]; then
            echo "::error::Expected 3 plugin ZIP files, found ${#plugin_archives[@]}."
            exit 1
          fi
          for archive in "${plugin_archives[@]}"; do
            archive_name="$(basename "$archive")"
            if [[ "$archive_name" != *-"$VERSION".zip ]]; then
              echo "::error::Plugin archive $archive_name does not match release version $VERSION."
              exit 1
            fi
          done

          mapfile -d '' root_archives < <(find release-assets -type f -name "webview-$VERSION.zip" -print0)
          if [[ "${#root_archives[@]}" -ne 1 ]]; then
            echo "::error::Expected one webview-$VERSION.zip, found ${#root_archives[@]}."
            exit 1
          fi

          manifest="release-npm/npm-packages.json"
          jq -e \
            --arg version "$VERSION" \
            --arg head_sha "$GITHUB_SHA" \
            '.schemaVersion == 1 and .version == $version and .commitSha == $head_sha and (.packages | length) == 2' \
            "$manifest" >/dev/null

          jq -e '
            ([.packages[] | [.canonicalName, .publishedName]] | sort_by(.[0])) ==
            [
              ["@nerzhulart/webview-sdk", "@nerzhulart/webview-sdk"],
              ["@nerzhulart/webview-testkit", "@nerzhulart/webview-testkit"]
            ]
          ' "$manifest" >/dev/null

          while IFS=$'\t' read -r published_name file expected_integrity; do
            if [[ "$file" == */* || "$file" == *\\* ]]; then
              echo "::error::Unsafe npm archive path in manifest: $file"
              exit 1
            fi
            archive="release-npm/$file"
            if [[ ! -f "$archive" ]]; then
              echo "::error::Missing npm archive: $archive"
              exit 1
            fi

            package_json="$(tar -xOf "$archive" package/package.json)"
            actual_name="$(jq -r '.name' <<<"$package_json")"
            actual_version="$(jq -r '.version' <<<"$package_json")"
            if [[ "$actual_name" != "$published_name" || "$actual_version" != "$VERSION" ]]; then
              echo "::error::$file contains $actual_name@$actual_version, expected $published_name@$VERSION."
              exit 1
            fi

            actual_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
            if [[ "$actual_integrity" != "$expected_integrity" ]]; then
              echo "::error::Integrity mismatch for $file."
              exit 1
            fi
          done < <(jq -r '.packages[] | [.publishedName, .file, .integrity] | @tsv' "$manifest")

          if [[ "$VERSION" == *-* ]]; then
            dist_tag="next"
          else
            dist_tag="latest"
          fi
          echo "dist_tag=$dist_tag" >>"$GITHUB_OUTPUT"
          echo "plugin_archive=${root_archives[0]}" >>"$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_ARCHIVE: ${{ steps.artifacts.outputs.plugin_archive }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          archive="$PLUGIN_ARCHIVE"
          tag="v$VERSION"

          if [[ ! -f "$archive" ]]; then
            echo "::error::Plugin archive not found: $archive"
            exit 1
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag points to $tag_sha, but this build used $GITHUB_SHA."
              exit 1
            fi
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            release_args=(
              release create "$tag"
              "$archive"
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "$tag"
              --generate-notes
            )
            version_without_build="${VERSION%%+*}"
            if [[ "$version_without_build" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh "${release_args[@]}"
          fi

      - name: Publish npm packages
        shell: bash
        env:
          DIST_TAG: ${{ steps.artifacts.outputs.dist_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          advance_prerelease_latest_if_no_stable() {
            local published_name="$1"
            local latest_version

            if [[ "$DIST_TAG" != "next" ]]; then
              return
            fi
            latest_version="$(npm view "$published_name" dist-tags.latest --json 2>/dev/null | jq -r '. // empty')" || latest_version=""
            if [[ -z "$latest_version" || "$latest_version" == *-* ]]; then
              npm dist-tag add "$published_name@$VERSION" latest
            fi
          }

          publish_or_verify() {
            local published_name="$1"
            local file="$2"
            local expected_integrity="$3"
            local view_error
            view_error="$(mktemp)"

            if existing_integrity="$(npm view "$published_name@$VERSION" dist.integrity --json 2>"$view_error" | jq -r '.')"; then
              if [[ "$existing_integrity" != "$expected_integrity" ]]; then
                echo "::error::$published_name@$VERSION already exists with different integrity."
                exit 1
              fi
              echo "$published_name@$VERSION is already published with matching integrity."
              advance_prerelease_latest_if_no_stable "$published_name"
              return
            fi
            if ! grep -q 'E404' "$view_error"; then
              cat "$view_error" >&2
              echo "::error::Unable to query $published_name@$VERSION before publishing."
              exit 1
            fi

            npm publish "./release-npm/$file" --access public --tag "$DIST_TAG"
            actual_integrity=""
            for attempt in {1..60}; do
              if actual_integrity="$(npm view "$published_name@$VERSION" dist.integrity --json 2>/dev/null | jq -r '.')"; then
                break
              fi
              if [[ "$attempt" -eq 60 ]]; then
                echo "::error::Unable to verify $published_name@$VERSION after publishing."
                exit 1
              fi
              sleep 5
            done
            if [[ "$actual_integrity" != "$expected_integrity" ]]; then
              echo "::error::Registry integrity mismatch after publishing $published_name@$VERSION."
              exit 1
            fi
            advance_prerelease_latest_if_no_stable "$published_name"
          }

          while IFS=$'\t' read -r published_name file integrity; do
            publish_or_verify "$published_name" "$file" "$integrity"
          done < <(jq -r '.packages | sort_by(.publishedName)[] | [.publishedName, .file, .integrity] | @tsv' release-npm/npm-packages.json)

      - name: Publish WebView plugin to JetBrains Marketplace
        shell: bash
        env:
          PLUGIN_ARCHIVE: ${{ steps.artifacts.outputs.plugin_archive }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${PUBLISH_TOKEN:-}" ]]; then
            echo "::error::PUBLISH_TOKEN repository secret is not configured"
            exit 1
          fi
          gradle \
            -PpluginArchiveFile="$PLUGIN_ARCHIVE" \
            -PpluginVersion="$VERSION" \
            :publishPlugin \
            --stacktrace \
            --no-configuration-cache
