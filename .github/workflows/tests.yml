name: Gradle tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JBR_VERSION: "25.0.3"
  JBR_BUILD: "508.16"

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            java_arch: x64
            jbr_platform: linux-x64
            jbr_sha512: ed864cb2fa29b742d0ca03c1f07ed85466a1c13796efb1a5ae81bd65c9b2d51b71117a0ab6c432d414cdba233abc0352c73e8071e78ff5c0abc51bf10a00e5ed
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            java_arch: aarch64
            jbr_platform: linux-aarch64
            jbr_sha512: 4727ff3131d1cf5353d16cb6e530d42d693db979f37864fd1a1f8d41912efd6ca79d46eaebadcc14cc54523f4c2c4ee376c06238af847f477a794a32ad12cec4
          - name: Windows x64
            runner: windows-2025
            java_arch: x64
            jbr_platform: windows-x64
            jbr_sha512: eca3bedf04a8c5fe781f4a96e8d31df0ad4570cff508febc297353abbd1ac1c9e4b477e58fa06076e6e182b718958ba25ead35dbb622200fdc8ff21077c45111
          - name: Windows ARM64
            runner: windows-11-arm
            java_arch: aarch64
            jbr_platform: windows-aarch64
            jbr_sha512: 4af6681517d8fe4f63a7c815aba373510769884968b6d9d1777af4d14cbd2444ae8dc691e9f55a56abf6457753bff42441369cd2100fe0806145e83232a77242
          - name: macOS Intel
            runner: macos-15-intel
            java_arch: x64
            jbr_platform: osx-x64
            jbr_sha512: 6008b16c5b3d52f2c5726ae45c584b7c0a7501277636d608e6615227618dddf7fb54c2f61f0de40bf896c6f34f4f6241a64ab8a3196d646f6010ff3dfd0bd188
          - name: macOS ARM64
            runner: macos-15
            java_arch: aarch64
            jbr_platform: osx-aarch64
            jbr_sha512: 44ef766f2f60f0d89ca211aaf8d85b44ac459d23c73cd2680c58c2d9afcede3f416fa84bb1af13e07b32b38a1c9d36ef0ee91d43a6f783aff31c0b64b38b5cb6

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read IntelliJ Platform version
        id: intellij-platform-version
        shell: pwsh
        run: |
          $versionLine = Get-Content -LiteralPath "gradle.properties" |
            Where-Object { $_ -match '^platformVersion=' } |
            Select-Object -First 1
          if (-not $versionLine) {
            throw "platformVersion is missing from gradle.properties"
          }

          $version = $versionLine.Substring("platformVersion=".Length).Trim()
          if (-not $version) {
            throw "platformVersion is empty in gradle.properties"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore IntelliJ Platform SDK
        id: intellij-sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: .intellijPlatform/ides
          key: intellij-platform-sdk-v2-${{ steps.intellij-platform-version.outputs.version }}-${{ runner.os }}

      - name: Download JBR archive
        shell: pwsh
        run: |
          $archiveDirectory = Join-Path $env:RUNNER_TEMP "jbr"
          $archivePath = Join-Path $archiveDirectory "jbrsdk_jcef.tar.gz"
          $archiveName = "jbrsdk_jcef-$env:JBR_VERSION-${{ matrix.jbr_platform }}-b$env:JBR_BUILD.tar.gz"
          $downloadUrl = "https://cache-redirector.jetbrains.com/intellij-jbr/$archiveName"

          New-Item -ItemType Directory -Force -Path $archiveDirectory | Out-Null
          & curl --fail --location --retry 3 --retry-all-errors --output $archivePath $downloadUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download JBR archive from $downloadUrl"
          }

      - name: Verify JBR archive
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP "jbr/jbrsdk_jcef.tar.gz"
          $expectedChecksum = "${{ matrix.jbr_sha512 }}"
          $actualChecksum = (Get-FileHash -Algorithm SHA512 -LiteralPath $archivePath).Hash.ToLowerInvariant()

          if ($actualChecksum -ne $expectedChecksum) {
            throw "JBR archive checksum mismatch: expected $expectedChecksum, got $actualChecksum"
          }

      - name: Set up custom JBR
        uses: actions/setup-java@v5
        with:
          distribution: jdkfile
          jdk-file: ${{ runner.temp }}/jbr/jbrsdk_jcef.tar.gz
          java-version: ${{ env.JBR_VERSION }}
          architecture: ${{ matrix.java_arch }}

      - name: Verify custom JBR
        shell: pwsh
        run: |
          $settings = (& java -XshowSettings:properties -version 2>&1 | Out-String)
          $settings

          if ($settings -notmatch "java\.vendor\s*=\s*JetBrains") {
            throw "Expected JetBrains Runtime, but java.vendor is different"
          }
          if ($settings -notmatch "java\.version\s*=\s*$env:JBR_VERSION") {
            throw "Expected JBR $env:JBR_VERSION, but java.version is different"
          }

          $expectedArchitecture = "${{ matrix.java_arch }}"
          if ($expectedArchitecture -eq "aarch64") {
            if ($settings -notmatch "os\.arch\s*=\s*aarch64") {
              throw "Expected aarch64 JBR, but os.arch is different"
            }
          }
          elseif ($settings -notmatch "os\.arch\s*=\s*(amd64|x86_64)") {
            throw "Expected x64 JBR, but os.arch is different"
          }

      - name: Restrict Gradle toolchains to custom JBR
        shell: pwsh
        run: |
          $gradleOptions = @(
            "-Dorg.gradle.java.installations.auto-detect=false"
            "-Dorg.gradle.java.installations.auto-download=false"
            "-Dorg.gradle.java.installations.paths=$env:JAVA_HOME"
            "-Dorg.gradle.project.org.jetbrains.intellij.platform.intellijPlatformIdesCacheEnabled=true"
          ) -join " "
          "GRADLE_OPTS=$gradleOptions" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-excludes: |
            caches/modules-2/files-2.1/com.jetbrains.intellij.idea/**

      - name: Resolve IntelliJ Platform SDK
        if: steps.intellij-sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & gradle :compileKotlin --stacktrace --build-cache --configuration-cache
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $sdkDirectories = @(Get-ChildItem -LiteralPath ".intellijPlatform/ides" -Directory -ErrorAction SilentlyContinue)
          if ($sdkDirectories.Count -eq 0) {
            throw "IntelliJ Platform SDK cache was not populated"
          }

      - name: Run Gradle tests on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=false
        run: xvfb-run -a -s "-screen 0 1920x1080x24" gradle test --stacktrace --build-cache

      - name: Run Gradle tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: gradle test --stacktrace --build-cache

      - name: Run Gradle tests on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: gradle test --stacktrace --build-cache

      - name: Publish Gradle test summary
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          annotate_only: true
          job_summary: true
          detailed_summary: true
          group_suite: true
          include_time_in_summary: true
          simplified_summary: true

      - name: Upload Gradle test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-reports-${{ matrix.name }}
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: warn

      - name: Upload IntelliJ test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: intellij-test-logs-${{ matrix.name }}
          path: |
            .intellijPlatform/sandbox/**/log-test/idea.log
            .intellijPlatform/sandbox/**/system-test/webview2/EBWebView/Crashpad/reports/**
          include-hidden-files: true
          if-no-files-found: warn
