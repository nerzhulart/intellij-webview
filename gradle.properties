pluginVersion=0.1.0-SNAPSHOT
platformVersion=2026.2.3
# Tests load the whole IDE into one core classloader. In the obfuscated IntelliJ IDEA release builds, the classes of
# `plugins/ultimate-plugin/lib/ultimate-plugin.jar` share names with `lib/product-backend.jar`, so its only extension, a
# postStartupActivity `Z.Z.Z.Z.Z`, resolves to an interface from product-backend.jar and every opened test project logs
# "Cannot create extension", which TestLoggerFactory turns into a test failure. The property replaces the default list
# of the IntelliJ Platform Gradle Plugin, so the first four entries repeat it.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=com.intellij.openRewrite,com.intellij.ja,com.intellij.ko,com.intellij.zh,com.intellij.modules.ultimate
kotlin.stdlib.default.dependency=false
kotlin.daemon.jvmargs=-Xmx2g
